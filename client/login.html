<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Overlapped - Login</title>

  <!-- T013: RPGUI CSS Links (Load Order: RPGUI → Overlapped Theme → Components) -->
  <link rel="stylesheet" href="styles/rpgui.min.css">
  <link rel="stylesheet" href="styles/overlapped-theme.css">
  <link rel="stylesheet" href="styles/components.css">

  <style>
    /* ULTRA ENHANCED LOGIN SCREEN - AAA QUALITY */
    .login-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 60px 20px;
      position: relative;
      overflow: hidden;
    }

    /* Darker animated background overlay */
    .login-wrapper::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(
        circle at center,
        rgba(139, 69, 19, 0.12) 0%,
        rgba(101, 67, 33, 0.06) 30%,
        transparent 70%
      );
      animation: rotateGlow 30s linear infinite;
      pointer-events: none;
    }

    @keyframes rotateGlow {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Subtle floating particles - darker theme */
    .login-wrapper::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-image:
        radial-gradient(2px 2px at 15% 20%, rgba(139, 69, 19, 0.4), transparent),
        radial-gradient(1px 1px at 85% 30%, rgba(101, 67, 33, 0.3), transparent),
        radial-gradient(2px 2px at 40% 80%, rgba(139, 69, 19, 0.35), transparent),
        radial-gradient(1px 1px at 75% 70%, rgba(101, 67, 33, 0.25), transparent),
        radial-gradient(2px 2px at 25% 50%, rgba(139, 69, 19, 0.3), transparent),
        radial-gradient(1px 1px at 90% 85%, rgba(101, 67, 33, 0.3), transparent);
      background-size: 300% 300%;
      animation: particleDrift 25s ease-in-out infinite;
      pointer-events: none;
      opacity: 0.3;
    }

    @keyframes particleDrift {
      0%, 100% {
        background-position: 0% 0%;
        opacity: 0.3;
      }
      50% {
        background-position: 100% 100%;
        opacity: 0.5;
      }
    }

    .login-panel {
      width: 100%;
      max-width: 800px;
      padding: 60px 60px;
      position: relative;
      z-index: 1;
      margin-top: 40px;
      box-shadow: 0 20px 80px rgba(0, 0, 0, 0.95),
                  0 0 60px rgba(139, 69, 19, 0.25),
                  inset 0 0 80px rgba(139, 69, 19, 0.15);
      animation: panelPulse 4s ease-in-out infinite;
    }

    @keyframes panelPulse {
      0%, 100% {
        box-shadow: 0 20px 80px rgba(0, 0, 0, 0.95),
                    0 0 60px rgba(139, 69, 19, 0.25),
                    inset 0 0 80px rgba(139, 69, 19, 0.15);
      }
      50% {
        box-shadow: 0 20px 80px rgba(0, 0, 0, 0.95),
                    0 0 80px rgba(139, 69, 19, 0.35),
                    inset 0 0 100px rgba(139, 69, 19, 0.2);
      }
    }

    .game-branding {
      text-align: center;
      margin-bottom: 60px;
      position: relative;
      z-index: 2;
    }

    /* Darker, more mysterious light rays */
    .game-branding::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 150%;
      height: 300%;
      background:
        conic-gradient(from 0deg at 50% 50%,
          transparent 0deg,
          rgba(139, 69, 19, 0.08) 10deg,
          transparent 20deg,
          transparent 40deg,
          rgba(101, 67, 33, 0.06) 50deg,
          transparent 60deg,
          transparent 80deg,
          rgba(139, 69, 19, 0.08) 90deg,
          transparent 100deg,
          transparent 120deg,
          rgba(101, 67, 33, 0.05) 130deg,
          transparent 140deg,
          transparent 160deg,
          rgba(139, 69, 19, 0.08) 170deg,
          transparent 180deg,
          transparent 200deg,
          rgba(101, 67, 33, 0.06) 210deg,
          transparent 220deg,
          transparent 240deg,
          rgba(139, 69, 19, 0.08) 250deg,
          transparent 260deg,
          transparent 280deg,
          rgba(101, 67, 33, 0.05) 290deg,
          transparent 300deg,
          transparent 320deg,
          rgba(139, 69, 19, 0.08) 330deg,
          transparent 340deg,
          transparent 360deg
        );
      pointer-events: none;
      animation: rotateLightRays 20s linear infinite;
      z-index: -1;
    }

    @keyframes rotateLightRays {
      0% { transform: translate(-50%, -50%) rotate(0deg); }
      100% { transform: translate(-50%, -50%) rotate(360deg); }
    }

    /* Epic title styling - DARK MYSTERIOUS */
    .game-branding h1 {
      font-size: 140px !important;
      margin: 0;
      margin-bottom: 25px;
      background: linear-gradient(180deg,
        #D4AF37 0%,
        #B8860B 25%,
        #8B6914 50%,
        #6B5210 75%,
        #4A3C0F 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0 0 30px rgba(139, 69, 19, 0.6))
              drop-shadow(0 0 60px rgba(101, 67, 33, 0.4))
              drop-shadow(0 0 90px rgba(101, 67, 33, 0.3))
              drop-shadow(0 0 120px rgba(101, 67, 33, 0.2))
              drop-shadow(8px 8px 20px rgba(0, 0, 0, 1));
      animation: epicTitlePulse 3s ease-in-out infinite, titleFloat 6s ease-in-out infinite;
      text-transform: uppercase;
      letter-spacing: 18px;
      font-weight: 900;
      word-wrap: break-word;
      max-width: 100%;
      position: relative;
      will-change: transform, filter;
    }

    @keyframes titleFloat {
      0%, 100% {
        transform: translateY(0px);
      }
      50% {
        transform: translateY(-10px);
      }
    }

    @keyframes epicTitlePulse {
      0%, 100% {
        filter: drop-shadow(0 0 30px rgba(139, 69, 19, 0.6))
                drop-shadow(0 0 60px rgba(101, 67, 33, 0.4))
                drop-shadow(0 0 90px rgba(101, 67, 33, 0.3))
                drop-shadow(0 0 120px rgba(101, 67, 33, 0.2))
                drop-shadow(8px 8px 20px rgba(0, 0, 0, 1));
      }
      50% {
        filter: drop-shadow(0 0 40px rgba(139, 69, 19, 0.8))
                drop-shadow(0 0 80px rgba(101, 67, 33, 0.6))
                drop-shadow(0 0 120px rgba(101, 67, 33, 0.4))
                drop-shadow(0 0 160px rgba(101, 67, 33, 0.3))
                drop-shadow(8px 8px 20px rgba(0, 0, 0, 1));
      }
    }

    .login-subtitle {
      text-align: center;
      font-size: 24px;
      font-style: italic;
      color: #B8860B;
      margin: 0;
      text-shadow: 3px 3px 8px rgba(0, 0, 0, 1),
                   0 0 20px rgba(139, 69, 19, 0.5),
                   0 0 40px rgba(101, 67, 33, 0.3);
      letter-spacing: 3px;
      font-weight: 500;
      animation: subtitleGlow 4s ease-in-out infinite;
    }

    @keyframes subtitleGlow {
      0%, 100% {
        text-shadow: 3px 3px 8px rgba(0, 0, 0, 1),
                     0 0 20px rgba(139, 69, 19, 0.5),
                     0 0 40px rgba(101, 67, 33, 0.3);
        opacity: 0.8;
      }
      50% {
        text-shadow: 3px 3px 8px rgba(0, 0, 0, 1),
                     0 0 25px rgba(139, 69, 19, 0.7),
                     0 0 50px rgba(101, 67, 33, 0.4);
        opacity: 0.95;
      }
    }

    .form-field {
      margin-bottom: 28px;
      position: relative;
    }

    .form-field label {
      display: block;
      margin-bottom: 12px;
      font-weight: 700;
      color: #B8860B;
      font-size: 16px;
      text-shadow: 1px 1px 3px rgba(0, 0, 0, 1),
                   0 0 10px rgba(139, 69, 19, 0.3);
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .form-field input {
      width: 100%;
      box-sizing: border-box;
      font-size: 16px;
      padding: 16px 20px;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .form-field input:focus {
      transform: scale(1.02);
      box-shadow:
        0 0 20px rgba(139, 69, 19, 0.5),
        0 0 40px rgba(101, 67, 33, 0.3),
        0 0 60px rgba(101, 67, 33, 0.15),
        inset 0 2px 4px rgba(0, 0, 0, 0.3),
        inset 0 0 20px rgba(139, 69, 19, 0.1);
    }

    .button-group {
      margin-top: 35px;
    }

    .button-group button {
      width: 100%;
      margin-bottom: 16px;
      font-size: 18px;
      padding: 18px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .button-group button p {
      font-size: 18px;
      font-weight: 700;
    }

    .footer-links {
      text-align: center;
      margin-top: 35px;
      font-size: 14px;
      opacity: 0.9;
    }

    .footer-links a {
      color: #B8860B;
      text-decoration: none;
      margin: 0 15px;
      text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8),
                   0 0 8px rgba(139, 69, 19, 0.2);
      transition: all 0.3s ease;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .footer-links a:hover {
      color: #D4AF37;
      text-shadow: 0 0 15px rgba(139, 69, 19, 0.6),
                   0 0 30px rgba(101, 67, 33, 0.4);
      transform: scale(1.05);
      display: inline-block;
    }

    @media (max-width: 768px) {
      .login-panel {
        max-width: 100%;
        padding: 40px 30px;
      }

      .game-branding {
        margin-bottom: 40px;
      }

      .game-branding h1 {
        font-size: 64px !important;
        letter-spacing: 6px;
      }

      .login-subtitle {
        font-size: 18px;
        letter-spacing: 2px;
      }
    }

    @media (max-width: 480px) {
      .game-branding h1 {
        font-size: 48px !important;
        letter-spacing: 4px;
      }

      .login-subtitle {
        font-size: 16px;
        letter-spacing: 1.5px;
      }
    }
  </style>
</head>
<body>
  <!-- T015: Wrap entire page content in rpgui-content -->
  <div class="rpgui-content">
    <div class="login-wrapper">
      <!-- T016: "Overlapped" game title - OUTSIDE the login box for maximum impact -->
      <div class="game-branding">
        <h1 class="game-title">Overlapped</h1>
        <p class="login-subtitle">Enter the realm of adventure...</p>
      </div>

      <!-- T017: Login form wrapped in rpgui-container framed-golden -->
      <div class="rpgui-container framed-golden login-panel">
        <!-- Login Form -->
        <form id="loginForm" action="/login" method="POST">
          <!-- T018: Email input field (auto-styled by RPGUI + overlapped-theme.css) -->
          <div class="form-field">
            <label for="email">Email</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="your@email.com"
              required
              autocomplete="email"
            >
          </div>

          <!-- T019: Password input field (auto-styled by RPGUI + overlapped-theme.css) -->
          <div class="form-field">
            <label for="password">Password</label>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Enter your password"
              required
              autocomplete="current-password"
            >
          </div>

          <!-- T020: Login button (golden RPGUI button) -->
          <!-- T021: Create Account button (standard RPGUI button) -->
          <div class="button-group">
            <button type="submit" class="rpgui-button golden">
              <p>Login</p>
            </button>

            <button type="button" class="rpgui-button" onclick="location.href='register.html'">
              <p>Create Account</p>
            </button>
          </div>
        </form>

        <!-- Footer Links -->
        <div class="footer-links">
          <a href="forgot-password.html">Forgot Password?</a>
          <span>|</span>
          <a href="help.html">Need Help?</a>
        </div>
      </div>
    </div>
  </div>

  <!-- T014: RPGUI JavaScript (defer for performance) -->
  <script src="scripts/rpgui.min.js" defer></script>

  <!-- Login Form Handler -->
  <script>
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      // Basic validation
      if (!email || !password) {
        alert('Please enter both email and password');
        return;
      }

      try {
        // Call the login API
        const response = await fetch('/api/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ email, password })
        });

        const result = await response.json();

        if (result.success) {
          // Redirect to character selection on successful login
          window.location.href = '/character-select';
        } else {
          alert(result.message || 'Login failed. Please check your credentials.');
        }
      } catch (error) {
        console.error('Login error:', error);
        alert('An error occurred during login. Please try again.');
      }
    });
  </script>
</body>
</html>
