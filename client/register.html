<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Overlapped - Create Account</title>

  <!-- RPGUI CSS Links (Load Order: RPGUI → Overlapped Theme → Components) -->
  <link rel="stylesheet" href="styles/rpgui.min.css">
  <link rel="stylesheet" href="styles/overlapped-theme.css">
  <link rel="stylesheet" href="styles/components.css">

  <style>
    /* REGISTRATION SCREEN - Matches Login Style */
    .login-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      padding: 60px 20px;
      position: relative;
      overflow-y: auto;
      overflow-x: hidden;
    }

    /* Static background overlay */
    .login-wrapper::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(
        circle at center,
        rgba(139, 69, 19, 0.12) 0%,
        rgba(101, 67, 33, 0.06) 30%,
        transparent 70%
      );
      pointer-events: none;
    }

    /* Static floating particles - darker theme */
    .login-wrapper::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-image:
        radial-gradient(2px 2px at 15% 20%, rgba(139, 69, 19, 0.4), transparent),
        radial-gradient(1px 1px at 85% 30%, rgba(101, 67, 33, 0.3), transparent),
        radial-gradient(2px 2px at 40% 80%, rgba(139, 69, 19, 0.35), transparent),
        radial-gradient(1px 1px at 75% 70%, rgba(101, 67, 33, 0.25), transparent),
        radial-gradient(2px 2px at 25% 50%, rgba(139, 69, 19, 0.3), transparent),
        radial-gradient(1px 1px at 90% 85%, rgba(101, 67, 33, 0.3), transparent);
      pointer-events: none;
      opacity: 0.3;
    }

    .login-panel {
      width: 100%;
      max-width: 800px;
      padding: 60px 60px;
      position: relative;
      z-index: 1;
      margin-top: 40px;
      box-shadow: 0 20px 80px rgba(0, 0, 0, 0.95),
                  0 0 70px rgba(139, 69, 19, 0.3),
                  inset 0 0 90px rgba(139, 69, 19, 0.175);
    }

    .game-branding {
      text-align: center;
      margin-bottom: 60px;
      position: relative;
      z-index: 2;
    }

    /* Static light rays */
    .game-branding::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 150%;
      height: 300%;
      background:
        conic-gradient(from 0deg at 50% 50%,
          transparent 0deg,
          rgba(139, 69, 19, 0.08) 10deg,
          transparent 20deg,
          transparent 40deg,
          rgba(101, 67, 33, 0.06) 50deg,
          transparent 60deg,
          transparent 80deg,
          rgba(139, 69, 19, 0.08) 90deg,
          transparent 100deg,
          transparent 120deg,
          rgba(101, 67, 33, 0.05) 130deg,
          transparent 140deg,
          transparent 160deg,
          rgba(139, 69, 19, 0.08) 170deg,
          transparent 180deg,
          transparent 200deg,
          rgba(101, 67, 33, 0.06) 210deg,
          transparent 220deg,
          transparent 240deg,
          rgba(139, 69, 19, 0.08) 250deg,
          transparent 260deg,
          transparent 280deg,
          rgba(101, 67, 33, 0.05) 290deg,
          transparent 300deg,
          transparent 320deg,
          rgba(139, 69, 19, 0.08) 330deg,
          transparent 340deg,
          transparent 360deg
        );
      pointer-events: none;
      z-index: -1;
    }

    /* Epic title styling - DARK MYSTERIOUS */
    .game-branding h1 {
      font-size: 140px !important;
      margin: 0;
      margin-bottom: 25px;
      background: linear-gradient(180deg,
        #D4AF37 0%,
        #B8860B 25%,
        #8B6914 50%,
        #6B5210 75%,
        #4A3C0F 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0 0 35px rgba(139, 69, 19, 0.7))
              drop-shadow(0 0 70px rgba(101, 67, 33, 0.5))
              drop-shadow(0 0 105px rgba(101, 67, 33, 0.35))
              drop-shadow(0 0 140px rgba(101, 67, 33, 0.25))
              drop-shadow(8px 8px 20px rgba(0, 0, 0, 1));
      text-transform: uppercase;
      letter-spacing: 18px;
      font-weight: 900;
      word-wrap: break-word;
      max-width: 100%;
      position: relative;
    }

    .login-subtitle {
      text-align: center;
      font-size: 24px;
      font-style: italic;
      color: #B8860B;
      margin: 0;
      text-shadow: 3px 3px 8px rgba(0, 0, 0, 1),
                   0 0 22.5px rgba(139, 69, 19, 0.6),
                   0 0 45px rgba(101, 67, 33, 0.35);
      letter-spacing: 3px;
      font-weight: 500;
      opacity: 0.9;
    }

    .form-field {
      margin-bottom: 28px;
      position: relative;
    }

    .form-field label {
      display: block;
      margin-bottom: 12px;
      font-weight: 700;
      color: #B8860B;
      font-size: 16px;
      text-shadow: 1px 1px 3px rgba(0, 0, 0, 1),
                   0 0 10px rgba(139, 69, 19, 0.3);
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .rpgui-content .form-field input {
      width: 100%;
      box-sizing: border-box;
      font-size: 16px;
      padding: 16px 20px;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif !important;
      font-weight: 700 !important;
      color: #000000 !important;
      text-shadow: none !important;
    }

    .form-field input:focus {
      box-shadow:
        0 0 20px rgba(139, 69, 19, 0.5),
        0 0 40px rgba(101, 67, 33, 0.3),
        0 0 60px rgba(101, 67, 33, 0.15),
        inset 0 2px 4px rgba(0, 0, 0, 0.3),
        inset 0 0 20px rgba(139, 69, 19, 0.1);
    }

    .button-group {
      margin-top: 35px;
    }

    .button-group button {
      width: 100%;
      margin-bottom: 16px;
    }

    .button-group button p {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin: 0;
      padding: 14px 20px;
    }

    .footer-links {
      text-align: center;
      margin-top: 35px;
      font-size: 14px;
      opacity: 0.9;
    }

    .footer-links a {
      color: #B8860B;
      text-decoration: none;
      margin: 0 15px;
      text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8),
                   0 0 8px rgba(139, 69, 19, 0.2);
      transition: all 0.3s ease;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .footer-links a:hover {
      color: #D4AF37;
      text-shadow: 0 0 15px rgba(139, 69, 19, 0.6),
                   0 0 30px rgba(101, 67, 33, 0.4);
      transform: scale(1.05);
      display: inline-block;
    }

    @media (max-width: 768px) {
      .login-panel {
        max-width: 100%;
        padding: 40px 30px;
      }

      .game-branding {
        margin-bottom: 40px;
      }

      .game-branding h1 {
        font-size: 64px !important;
        letter-spacing: 6px;
      }

      .login-subtitle {
        font-size: 18px;
        letter-spacing: 2px;
      }
    }

    @media (max-width: 480px) {
      .game-branding h1 {
        font-size: 48px !important;
        letter-spacing: 4px;
      }

      .login-subtitle {
        font-size: 16px;
        letter-spacing: 1.5px;
      }
    }
  </style>
</head>
<body>
  <div class="rpgui-content">
    <div class="login-wrapper">
      <!-- Game Title -->
      <div class="game-branding">
        <h1 class="game-title">Overlapped</h1>
        <p class="login-subtitle">Begin your legendary journey...</p>
      </div>

      <!-- Registration Form -->
      <div class="rpgui-container framed-golden login-panel">
        <form id="registerForm" action="/register" method="POST">
          <!-- Username Field -->
          <div class="form-field">
            <label for="username">Username</label>
            <input
              type="text"
              id="username"
              name="username"
              placeholder="Choose your username"
              required
              autocomplete="username"
              minlength="3"
              maxlength="20"
            >
          </div>

          <!-- Email Field -->
          <div class="form-field">
            <label for="email">Email</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="your@email.com"
              required
              autocomplete="email"
            >
          </div>

          <!-- Password Field -->
          <div class="form-field">
            <label for="password">Password</label>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Create a password"
              required
              autocomplete="new-password"
              minlength="6"
            >
          </div>

          <!-- Confirm Password Field -->
          <div class="form-field">
            <label for="confirmPassword">Confirm Password</label>
            <input
              type="password"
              id="confirmPassword"
              name="confirmPassword"
              placeholder="Confirm your password"
              required
              autocomplete="new-password"
              minlength="6"
            >
          </div>

          <!-- Buttons -->
          <div class="button-group">
            <button type="submit" class="rpgui-button golden">
              <p>Create Account</p>
            </button>

            <button type="button" class="rpgui-button" onclick="location.href='login.html'">
              <p>Back to Login</p>
            </button>
          </div>
        </form>

        <!-- Footer Links -->
        <div class="footer-links">
          <a href="login.html">Already have an account?</a>
        </div>
      </div>
    </div>
  </div>

  <!-- RPGUI JavaScript -->
  <script src="scripts/rpgui.min.js" defer></script>

  <!-- Registration Form Handler -->
  <script>
    document.getElementById('registerForm').addEventListener('submit', async function(e) {
      e.preventDefault();

      const username = document.getElementById('username').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      // Validation
      if (!username || !email || !password || !confirmPassword) {
        alert('Please fill in all fields');
        return;
      }

      if (password !== confirmPassword) {
        alert('Passwords do not match');
        return;
      }

      if (password.length < 6) {
        alert('Password must be at least 6 characters long');
        return;
      }

      if (username.length < 3) {
        alert('Username must be at least 3 characters long');
        return;
      }

      try {
        // Call the registration API
        const response = await fetch('/api/register', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ username, email, password })
        });

        const result = await response.json();

        if (result.success) {
          alert('Account created successfully! Please login.');
          window.location.href = '/login';
        } else {
          alert(result.message || 'Registration failed. Please try again.');
        }
      } catch (error) {
        console.error('Registration error:', error);
        alert('An error occurred during registration. Please try again.');
      }
    });
  </script>
</body>
</html>
